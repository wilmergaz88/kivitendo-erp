<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/kivitendo-erp

    <Directory /var/www/kivitendo-erp>
        AllowOverride All
        Options ExecCGI FollowSymLinks
        Require all granted

        # Serve .fpl files as FastCGI scripts
        AddHandler fcgid-script .fpl

        # Wrap .pl CGI requests through the FastCGI dispatcher
        FcgidWrapper /var/www/kivitendo-erp/dispatcher.fpl .pl
    </Directory>

    # FastCGI tuning
    FcgidMaxRequestLen   10485760
    FcgidConnectTimeout  20
    FcgidIOTimeout       600
    FcgidBusyTimeout     600
    # Keep processes alive; Apache/mod_fcgid manages recycling
    FcgidProcessLifeTime 0
    FcgidMaxProcessesPerClass 5

    ErrorLog  ${APACHE_LOG_DIR}/kivitendo-error.log
    CustomLog ${APACHE_LOG_DIR}/kivitendo-access.log combined
</VirtualHost>
