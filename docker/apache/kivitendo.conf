<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/kivitendo-erp

    # Redirect bare root to the login page
    RedirectMatch ^/$ /login.pl

    # Route all .pl requests through the single FastCGI dispatcher.
    # This is the official recommended pattern (doc/dokumentation.xml §2.7):
    # one persistent dispatcher.fcgi process handles all requests.
    AliasMatch ^/kivitendo-erp/[^/]+\.pl  /var/www/kivitendo-erp/dispatcher.fcgi
    Alias       /kivitendo-erp/             /var/www/kivitendo-erp/

    # Also serve requests at the root (no /kivitendo-erp/ path prefix)
    AliasMatch ^/[^/]+\.pl                 /var/www/kivitendo-erp/dispatcher.fcgi

    <Directory /var/www/kivitendo-erp>
        AllowOverride All
        Options ExecCGI Includes FollowSymLinks
        Require all granted

        # mod_fcgid does NOT auto-handle .fcgi — this line is required for
        # dispatcher.fcgi to be executed as FastCGI rather than served as text
        # or run via regular CGI (which would fail with exit code 1).
        AddHandler fcgid-script .fcgi .fpl
    </Directory>

    # Block direct browser access to runtime and sensitive directories.
    <DirectoryMatch "^/var/www/kivitendo-erp/(users|spool|webdav)(/|$)">
        Require all denied
    </DirectoryMatch>

    # FCGId tuning for long-running ERP requests
    FcgidMaxRequestLen   10485760
    FcgidConnectTimeout  20
    FcgidIOTimeout       600
    FcgidBusyTimeout     600
    FcgidProcessLifeTime 0
    FcgidMaxProcessesPerClass 5

    # Log to stdout/stderr so Docker captures them via `docker compose logs`
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
