services:

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER:              ${DB_USER:-postgres}
      POSTGRES_PASSWORD:          ${DB_PASSWORD:-}
      POSTGRES_DB:                ${DB_NAME:-kivitendo_auth}
      # kivitendo connects with an empty password by default (matches
      # kivitendo.conf.default). trust auth avoids connection failures.
      POSTGRES_HOST_AUTH_METHOD:  trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kivitendo_auth}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    environment:
      ROLE:             app
      DB_HOST:          db
      DB_PORT:          ${DB_PORT:-5432}
      DB_NAME:          ${DB_NAME:-kivitendo_auth}
      DB_USER:          ${DB_USER:-postgres}
      DB_PASSWORD:      ${DB_PASSWORD:-}
      ADMIN_PASSWORD:   ${ADMIN_PASSWORD:-admin123}
      SMTP_HOST:        mailhog
      SMTP_PORT:        ${SMTP_PORT:-1025}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:-}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - kivi_users:/var/www/kivitendo-erp/users
      - kivi_spool:/var/www/kivitendo-erp/spool
      - kivi_webdav:/var/www/kivitendo-erp/webdav
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  task-server:
    build: .
    restart: unless-stopped
    environment:
      ROLE:             task-server
      DB_HOST:          db
      DB_PORT:          ${DB_PORT:-5432}
      DB_NAME:          ${DB_NAME:-kivitendo_auth}
      DB_USER:          ${DB_USER:-postgres}
      DB_PASSWORD:      ${DB_PASSWORD:-}
      ADMIN_PASSWORD:   ${ADMIN_PASSWORD:-admin123}
      SMTP_HOST:        mailhog
      SMTP_PORT:        ${SMTP_PORT:-1025}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:-}
    volumes:
      - kivi_users:/var/www/kivitendo-erp/users
      - kivi_spool:/var/www/kivitendo-erp/spool
      - kivi_webdav:/var/www/kivitendo-erp/webdav
    depends_on:
      # Wait for `app` (healthy) to ensure the auth DB has been initialized
      # through the web admin interface before the task server tries to connect.
      app:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAILHOG_PORT:-8025}:8025"     # Web UI
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP (internal name: mailhog, port 1025)

volumes:
  postgres_data:
  kivi_users:
  kivi_spool:
  kivi_webdav:
